<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magis Incorporadora — Solicitações de Compra</title>
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#dcdad2;--ac:#c2570c;--ac2:#fff;--ok:#2e7d32}
@media(prefers-color-scheme:dark){:root{--bg:#171716;--sf:#222220;--tx:#f0efe9;--mu:#a09f97;--bd:#3a3935;--ac:#e8803a;--ac2:#171716;--ok:#4caf50}}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
nav button{flex:none;background:var(--sf);color:var(--tx);border:1px solid var(--bd);padding:9px 14px;border-radius:8px;font:inherit}
nav button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input[readonly]{opacity:.75}
input[type=checkbox]{width:auto}
.ck{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px;margin:10px 0 0}
.row{display:flex;gap:8px}.row>*{flex:1}.wrap{flex-wrap:wrap}.wrap>*{min-width:150px}
button.p{background:var(--ac);color:var(--ac2);border:0;padding:12px 16px;border-radius:8px;font:inherit;font-weight:600;width:100%;margin-top:12px}
button.g{background:var(--ok);color:#fff;border:0;padding:12px 16px;border-radius:8px;font:inherit;font-weight:600}
button.o{background:var(--sf);color:var(--ac);border:2px solid var(--ac);padding:10px 16px;border-radius:8px;font:inherit;font-weight:600}
button.o.on{background:var(--ac);color:var(--ac2)}
button.s{background:none;color:var(--ac);border:1px dashed var(--ac);padding:11px;border-radius:8px;font:inherit;width:100%;margin-top:10px}
button.x{background:none;border:0;color:var(--mu);font-size:16px;padding:4px 8px;cursor:pointer}
.ic{background:none;border:0;padding:6px;cursor:pointer;color:var(--ac);line-height:0}.ic.del{color:#d32f2f}
.pick{width:100%;text-align:left;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.sb{flex:1;background:var(--sf);color:var(--tx);border:1px solid var(--bd);padding:10px;border-radius:8px;font:inherit}.sb.on{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}
.obra{background:var(--bg);border-left:4px solid var(--ac);padding:10px 12px;border-radius:6px;margin-top:10px}
.tag{display:inline-block;background:var(--ac);color:var(--ac2);padding:2px 9px;border-radius:99px;font-size:13px;font-weight:600}
.urg{display:inline-block;background:#d32f2f;color:#fff;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.ths{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.th{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--bd);cursor:pointer}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:middle}
th{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.mu{color:var(--mu);font-size:13px}.err{color:#d32f2f;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.hide{display:none}
</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style id="brand">
:root{--bg:#f4f2f1;--sf:#fff;--tx:#2d2725;--mu:#6f6764;--bd:#e0dbd9;--ac:#931d1f;--ac2:#fff;--dk:#2d2725}
@media(prefers-color-scheme:dark){:root{--bg:#181514;--sf:#231f1e;--tx:#f1eeed;--mu:#a59d9a;--bd:#3b3533;--ac:#d2474a;--ac2:#fff;--dk:#4a4240}}
body{font-family:"Montserrat","Segoe UI",system-ui,-apple-system,sans-serif}
.top{background:var(--sf);border-bottom:3px solid var(--ac);padding:10px 16px}
.topin{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{height:40px;width:auto;display:block}
.brand{font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:14px;line-height:1.15}
.topr{margin-left:auto;text-align:right;font-size:12px}
h1{font-size:20px}h2{color:var(--ac);font-weight:700;letter-spacing:.06em}
nav button{text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:600;border-radius:4px}
.card{border-radius:6px;box-shadow:0 1px 3px rgba(45,39,37,.08)}
button.p,button.g,button.o,button.s,input,select,.pick,.sb{border-radius:4px}
button.g{background:var(--dk)}
button.p,button.g,button.o{letter-spacing:.03em}
th{letter-spacing:.06em}
</style>
</head><body>
<main id="login" class="hide">
 <div style="text-align:center;margin:20px 0 4px"><img class="logo" alt="Magis" style="height:88px;margin:0 auto"><h1 style="margin-top:12px;text-transform:uppercase;letter-spacing:.08em;font-size:19px">Magis Incorporadora</h1><div class="mu">Solicitações de Compra</div></div>
 <div class="card" style="margin-top:16px"><label>Usuário</label><input id="lgU" autocomplete="username" autocapitalize="none">
  <label>Senha</label><input id="lgP" type="password" autocomplete="current-password">
  <button class="p" id="lgBtn">Entrar</button><div class="err" id="lgMsg"></div></div>
</main>
<div id="app" class="hide"><div class="top"><div class="topin"><img class="logo" alt="Magis"><div class="brand">Magis Incorporadora</div><div class="topr mu"><span id="quem"></span> <button class="x" id="sair">Sair</button></div></div></div>
<main>
<nav id="nav"></nav>
<div id="v-sol">
 <div class="row wrap" style="margin-bottom:12px"><button class="g" id="bNova">+ Nova solicitação de compra</button><button class="o" id="bHist">Histórico de solicitações de compra</button></div>
 <div id="p-hist">
  <div id="hLista">
   <div class="card"><div class="row wrap"><div><label>Usuário</label><select id="fU"></select></div><div><label>Obra</label><select id="fO"></select></div></div>
    <div class="row wrap"><div><label>Data de</label><input type="date" id="fA"></div><div><label>Data até</label><input type="date" id="fB"></div></div>
    <button class="s" id="fLimpa">Limpar filtros</button></div>
   <div class="card tw"><table><thead><tr><th>Nº</th><th>Usuário</th><th>Data</th><th>Obra</th><th></th></tr></thead><tbody id="hBody"></tbody></table><div id="hVazio" class="mu hide" style="padding:10px 0">Nenhuma solicitação encontrada.</div></div>
  </div>
  <div id="hDet" class="hide"></div>
 </div>
 <div id="p-nova" class="hide">
  <div class="card"><label>Obra</label><select id="fObra"></select><div id="obraInfo"></div>
   <label>Data da entrega</label><input id="dEnt" type="date"></div>
  <div class="card"><h2 style="margin-top:0">Adicionar item</h2>
   <label>Item</label><button class="pick" id="itemBtn" type="button">Toque para escolher o item</button><input id="itemTxt" class="hide" placeholder="Descrição do item">
   <div class="row wrap"><div><label>Unidade</label><input id="uni" readonly></div><div><label>Quantidade</label><input id="qtd" type="number" min="0" step="any" inputmode="decimal"></div></div>
   <label>Fotos (opcional, até 3)</label><input type="file" id="fotoIn" accept="image/*" multiple><div id="fotoPrev"></div>
   <button class="p" id="addBtn">Adicionar à lista</button>
   <button class="s" id="manBtn">Lançar material manualmente</button></div>
  <div class="card"><h2 style="margin-top:0">Itens adicionados</h2><div class="tw" id="tabItens"></div>
   <label class="ck"><input type="checkbox" id="fUrg"> Urgente</label>
   <div class="row wrap" style="margin-top:12px"><button class="o" id="bPdf">Gerar PDF</button><button class="g" id="enviar">Enviar solicitação</button></div></div>
 </div>
</div>
<div id="v-cad" class="hide">
 <div class="row" style="margin-bottom:12px"><button class="sb" id="sObras">Obras</button><button class="sb" id="sMats">Materiais</button><button class="sb" id="sUsu">Usuários</button></div>
 <div id="v-obras"><button class="p" id="oTog" style="margin:0 0 12px">+ Adicionar obra</button>
  <div class="card hide" id="oForm"><label>Nome do empreendimento</label><input id="oN"><label>Endereço completo</label><input id="oE"><label>Tag da obra</label><input id="oT"><button class="p" id="oSave">Salvar obra</button><button class="s" id="oCan">Cancelar</button></div><div class="card tw"><table><thead><tr><th>Tag</th><th>Empreendimento</th><th>Endereço</th><th>Ação</th></tr></thead><tbody id="oList"></tbody></table></div></div>
 <div id="v-mats" class="hide"><button class="p" id="mTog" style="margin:0 0 12px">+ Adicionar material</button>
  <div class="card hide" id="mForm"><label>Descrição do material</label><input id="mD"><label>Unidade de medida</label><input id="mU" placeholder="un, m, m², kg, sc, l…"><button class="p" id="mSave">Salvar material</button><button class="s" id="mCan">Cancelar</button></div><div class="card tw"><table><thead><tr><th>Item</th><th>Unidade</th><th>Ação</th></tr></thead><tbody id="mList"></tbody></table></div></div>
 <div id="v-usu" class="hide"><button class="p" id="uTog" style="margin:0 0 12px">+ Adicionar usuário</button>
  <div class="card hide" id="uForm"><label>Usuário (login)</label><input id="uU" autocapitalize="none"><label>Nome</label><input id="uN"><label>Senha (mín. 6 caracteres)</label><input id="uP" type="text" autocomplete="off">
   <label>Tipo de acesso</label><select id="uR"><option value="mestre">Mestre (só solicita)</option><option value="admin">Administrador</option></select><button class="p" id="uSave">Criar usuário</button></div><div id="uList"></div></div>
</div>
</main></div>
<div id="pick" class="modal hide"><div class="card" style="width:100%;max-width:480px;max-height:85vh;overflow:auto;margin:0">
 <b>Selecione o item</b><input id="pickQ" placeholder="Buscar item…" style="margin-top:8px"><div id="pickList" style="margin-top:8px"></div><button class="s" id="pickX">Fechar</button></div></div>
<div id="lb" class="modal hide"><img id="lbImg" style="max-width:100%;max-height:100%;border-radius:8px"></div>
<div id="dlg" class="modal hide"><div class="card" style="max-width:380px;width:100%;margin:0;text-align:center">
 <div style="color:var(--ok);font-weight:600">Solicitação enviada ✔</div>
 <div class="mu" style="margin-top:10px">Número da solicitação</div><div id="dlgNum" style="font-size:30px;font-weight:700"></div>
 <div style="margin-top:6px"><span class="mu">Usuário:</span> <b id="dlgUser"></b></div><div class="mu" id="dlgDt" style="margin-top:4px"></div>
 <div class="row" style="margin-top:12px"><button class="o" id="dlgPdf">Baixar PDF</button><button class="g" id="dlgOk">OK (Enter)</button></div></div></div>

let me=null,admin=false,obras=[],mats=[],itens=[],obra=null,reqs=[],usuarios=[],viewId=null,edit=false,draft=null,selMat=null,manual=false,fFotos=[],ultimo=null;
const hoje=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const fd=s=>s?s.split("-").reverse().join("/"):"—";
const fdt=t=>new Date(t).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"medium"});
const rn=(tag,n)=>n?tag+"-"+String(n).padStart(3,"0"):"—";
const URG='<span class="urg">● URGENTE</span>';
const obraBox=o=>'<div class="obra"><span class="tag">'+esc(o.tag)+'</span> <b>'+esc(o.nome||"")+'</b><div class="mu" style="margin-top:4px">Endereço de entrega</div><div>'+esc(o.endereco)+'</div></div>';
const erro=e=>alert("Erro: "+(e&&e.message?e.message:e));

/* ---------- login ---------- */
function telaLogin(){$("app").classList.add("hide");$("login").classList.remove("hide");$("lgP").value="";}
$("lgBtn").onclick=async()=>{$("lgMsg").textContent="";const {error}=await sb.auth.signInWithPassword({email:$("lgU").value.trim().toLowerCase()+DOM,password:$("lgP").value});if(error)return $("lgMsg").textContent="Usuário ou senha inválidos.";await entrar();};
$("lgP").onkeydown=e=>{if(e.key==="Enter")$("lgBtn").click();};
$("sair").onclick=async()=>{await sb.auth.signOut();me=null;telaLogin();};
async function entrar(){
 const {data:{session}}=await sb.auth.getSession();if(!session)return telaLogin();
 const {data:p}=await sb.from("perfis").select("*").eq("id",session.user.id).maybeSingle();
 if(!p||!p.ativo){await sb.auth.signOut();telaLogin();$("lgMsg").textContent="Usuário sem acesso.";return;}
 me=p;admin=p.papel==="admin";
 $("login").classList.add("hide");$("app").classList.remove("hide");$("quem").textContent=p.nome||p.usuario;
 await carregarBase();nav("sol");
}

/* ---------- navegação ---------- */
const tabs=[["sol","Solicitações de Compra"],["cad","Cadastros"]];
function nav(cur){
 $("nav").innerHTML="";
 tabs.forEach(([k,t])=>{if(k==="cad"&&!admin)return;const b=document.createElement("button");b.textContent=t;b.className=k===cur?"on":"";b.onclick=()=>nav(k);$("nav").appendChild(b);});
 tabs.forEach(([k])=>$("v-"+k).classList.toggle("hide",k!==cur));
 if(cur==="sol")abrirHist();
 if(cur==="cad"&&admin)sub(window._sub||"obras");
}
function sub(k){window._sub=k;["obras","mats","usu"].forEach(x=>$("v-"+x).classList.toggle("hide",x!==k));$("sObras").classList.toggle("on",k==="obras");$("sMats").classList.toggle("on",k==="mats");$("sUsu").classList.toggle("on",k==="usu");if(k==="usu")carregarUsuarios();}
$("sObras").onclick=()=>sub("obras");$("sMats").onclick=()=>sub("mats");$("sUsu").onclick=()=>sub("usu");

/* ---------- cadastros ---------- */
async function carregarBase(){
 const [o,m]=await Promise.all([sb.from("obras").select("*").order("tag"),sb.from("materiais").select("*").order("descricao")]);
 obras=o.data||[];mats=m.data||[];
 const cur=$("fObra").value;
 $("fObra").innerHTML='<option value="">Selecione a obra…</option>'+obras.map(x=>'<option value="'+x.id+'">'+esc(x.tag)+(x.nome?' — '+esc(x.nome):'')+'</option>').join("");
 $("fObra").value=obras.some(x=>x.id===cur)?cur:"";showObra();
 if(admin){listaEd($("oList"),"obras",obras,[["tag"],["nome"],["endereco"]]);listaEd($("mList"),"materiais",mats,[["descricao"],["unidade"]]);}
}
const ICO_ED='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',ICO_DEL='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
let editCad=null;
const FORM={obras:{form:"oForm",campos:{nome:"oN",endereco:"oE",tag:"oT"},btn:"oSave",txt:"Salvar obra"},materiais:{form:"mForm",campos:{descricao:"mD",unidade:"mU"},btn:"mSave",txt:"Salvar material"}};
function editarCad(t,r){const F=FORM[t];editCad={t,id:r.id};for(const [f,i] of Object.entries(F.campos))$(i).value=r[f];$(F.btn).textContent="Salvar alterações";$(F.form).classList.remove("hide");$(F.form).scrollIntoView({block:"center"});}
function fimCad(t){const F=FORM[t];editCad=null;for(const i of Object.values(F.campos))$(i).value="";$(F.btn).textContent=F.txt;$(F.form).classList.add("hide");}
function listaEd(el,tabela,rows,campos){
 el.innerHTML=rows.map(r=>'<tr>'+campos.map(([f])=>'<td>'+esc(r[f])+'</td>').join("")+'<td style="white-space:nowrap"><button class="ic" data-ed="'+r.id+'" title="Editar">'+ICO_ED+'</button><button class="ic del" data-del="'+r.id+'" title="Excluir">'+ICO_DEL+'</button></td></tr>').join("")||'<tr><td colspan="'+(campos.length+1)+'" class="mu">Nenhum cadastro ainda.</td></tr>';
 el.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>editarCad(tabela,rows.find(x=>x.id===b.dataset.ed)));
 el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("Excluir este cadastro?"))return;const {error}=await sb.from(tabela).delete().eq("id",b.dataset.del);if(error)return erro(error);await carregarBase();});
}
$("oTog").onclick=()=>{fimCad("obras");$("oForm").classList.remove("hide");};$("mTog").onclick=()=>{fimCad("materiais");$("mForm").classList.remove("hide");};$("uTog").onclick=()=>$("uForm").classList.toggle("hide");
$("oSave").onclick=async()=>{const nome=$("oN").value.trim(),endereco=$("oE").value.trim(),tag=$("oT").value.trim();if(!nome||!endereco||!tag)return alert("Preencha todos os campos.");const ed=editCad&&editCad.t==="obras"?editCad.id:null;const {error}=ed?await sb.from("obras").update({nome,endereco,tag}).eq("id",ed):await sb.from("obras").insert({nome,endereco,tag});if(error)return erro(error.code==="23505"?"Já existe uma obra com essa tag.":error);fimCad("obras");await carregarBase();};
$("oCan").onclick=()=>fimCad("obras");
$("mSave").onclick=async()=>{const descricao=$("mD").value.trim(),unidade=$("mU").value.trim();if(!descricao||!unidade)return alert("Preencha descrição e unidade.");const ed=editCad&&editCad.t==="materiais"?editCad.id:null;const {error}=ed?await sb.from("materiais").update({descricao,unidade}).eq("id",ed):await sb.from("materiais").insert({descricao,unidade});if(error)return erro(error);fimCad("materiais");await carregarBase();};
$("mCan").onclick=()=>fimCad("materiais");

/* ---------- usuários ---------- */
async function fn(body){const {data,error}=await sb.functions.invoke("admin-users",{body});if(error){let m=error.message;try{m=(await error.context.json()).erro||m;}catch(e){}throw new Error(m);}return data;}
async function carregarUsuarios(){
 try{usuarios=(await fn({acao:"listar"})).usuarios;}catch(e){return erro(e);}
 $("uList").innerHTML=usuarios.map(u=>'<div class="card" data-u="'+u.id+'"><b>'+esc(u.usuario)+'</b><label>Nome</label><input data-f="nome" value="'+esc(u.nome||"")+'"><div class="row"><div><label>Tipo</label><select data-f="papel"><option value="mestre"'+(u.papel==="mestre"?" selected":"")+'>Mestre</option><option value="admin"'+(u.papel==="admin"?" selected":"")+'>Administrador</option></select></div><div><label>Nova senha (opcional)</label><input data-f="senha" autocomplete="off"></div></div><label class="ck"><input type="checkbox" data-f="ativo"'+(u.ativo?" checked":"")+'> Acesso ativo</label><button class="p" data-save="'+u.id+'">Salvar alterações</button></div>').join("");
 $("uList").querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{const c=b.closest("[data-u]"),g=f=>c.querySelector('[data-f="'+f+'"]');try{await fn({acao:"editar",id:b.dataset.save,nome:g("nome").value.trim(),papel:g("papel").value,ativo:g("ativo").checked,senha:g("senha").value||undefined});alert("Usuário atualizado.");carregarUsuarios();}catch(e){erro(e);}});
}
$("uSave").onclick=async()=>{try{await fn({acao:"criar",usuario:$("uU").value,nome:$("uN").value.trim(),senha:$("uP").value,papel:$("uR").value});["uU","uN","uP"].forEach(i=>$(i).value="");$("uForm").classList.add("hide");carregarUsuarios();}catch(e){erro(e);}};

/* ---------- PDF ---------- */
function pdf(d){
 const {jsPDF}=window.jspdf,doc=new jsPDF();
 doc.setFontSize(17);doc.text("Solicitação de Compra",14,18);
 doc.autoTable({startY:24,theme:"plain",styles:{fontSize:10},columnStyles:{0:{fontStyle:"bold",cellWidth:46}},body:[["Nº da solicitação",d.num],["Usuário",d.usuario],["Data e hora",d.quando],["Obra",d.obra],["Endereço de entrega",d.endereco],["Data da entrega",d.entrega],["Urgente",d.urg?"SIM":"Não"]]});
 doc.autoTable({startY:doc.lastAutoTable.finalY+8,head:[["Item","Quantidade","Unidade"]],body:d.itens.map(i=>[i.desc,String(i.qtd),i.un]),headStyles:{fillColor:[194,87,12]},styles:{fontSize:10}});
 doc.save("solicitacao-"+String(d.num).replace(/[^A-Za-z0-9-]/g,"")+".pdf");
}
const dadosReq=r=>({num:rn(r.tag,r.numero),usuario:r.mestre,quando:fdt(r.abertura_em),obra:r.tag+(r.empreendimento?" — "+r.empreendimento:""),endereco:r.endereco,entrega:fd(r.data_entrega),urg:r.urgente,itens:r.itens});

/* ---------- solicitações: abas internas ---------- */
function painel(k){$("p-hist").classList.toggle("hide",k!=="hist");$("p-nova").classList.toggle("hide",k!=="nova");$("bHist").classList.toggle("on",k==="hist");}
function abrirHist(){painel("hist");viewId=null;edit=false;$("hLista").classList.remove("hide");$("hDet").classList.add("hide");carregarReqs();}
function abrirNova(){painel("nova");resetForm();}
$("bNova").onclick=abrirNova;$("bHist").onclick=abrirHist;

/* ---------- nova solicitação ---------- */
function showObra(){obra=obras.find(o=>o.id===$("fObra").value)||null;$("obraInfo").innerHTML=obra?obraBox(obra):"";}
$("fObra").onchange=showObra;
function resetForm(){itens=[];$("fObra").value="";$("dEnt").value="";$("fUrg").checked=false;limparItem();showObra();renderTab();}
function limparItem(){selMat=null;manual=false;fFotos=[];["itemTxt","uni","qtd","fotoIn"].forEach(i=>$(i).value="");renderManual();renderFotos();}
function renderManual(){$("itemBtn").classList.toggle("hide",manual);$("itemTxt").classList.toggle("hide",!manual);$("uni").readOnly=!manual;$("itemBtn").textContent=selMat?selMat.descricao:"Toque para escolher o item";$("manBtn").textContent=manual?"Voltar ao material cadastrado":"Lançar material manualmente";}
$("manBtn").onclick=()=>{manual=!manual;selMat=null;$("itemTxt").value="";$("uni").value="";renderManual();};
function renderFotos(){$("fotoPrev").innerHTML=fFotos.length?'<div class="ths">'+fFotos.map(f=>'<img class="th" src="'+f.url+'">').join("")+'</div>':'';}
async function comprime(f){const b=await createImageBitmap(f),s=Math.min(1,1280/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext("2d").drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",.75));}
$("fotoIn").onchange=async()=>{for(const f of [...$("fotoIn").files]){if(fFotos.length>=3)break;try{const blob=await comprime(f);fFotos.push({blob,url:URL.createObjectURL(blob)});}catch(e){alert("Não foi possível usar uma das fotos.");}}$("fotoIn").value="";renderFotos();};
/* escolha do item (lista de materiais cadastrados) */
function pickLista(){const q=$("pickQ").value.trim().toLowerCase();$("pickList").innerHTML=mats.filter(m=>!q||m.descricao.toLowerCase().includes(q)).map(m=>'<label class="ck" style="padding:9px 4px;border-bottom:1px solid var(--bd)"><input type="checkbox" data-m="'+m.id+'"> <span style="flex:1">'+esc(m.descricao)+'</span><span class="mu">'+esc(m.unidade)+'</span></label>').join("")||'<div class="mu">Nenhum material cadastrado.</div>';
 $("pickList").querySelectorAll("input").forEach(i=>i.onchange=()=>{selMat=mats.find(m=>m.id===i.dataset.m);$("uni").value=selMat.unidade;$("pick").classList.add("hide");renderManual();});}
$("itemBtn").onclick=()=>{$("pickQ").value="";pickLista();$("pick").classList.remove("hide");};
$("pickQ").oninput=pickLista;$("pickX").onclick=()=>$("pick").classList.add("hide");
$("addBtn").onclick=()=>{
 const q=$("qtd").value;let desc,un;
 if(manual){desc=$("itemTxt").value.trim();un=$("uni").value.trim();}else{if(!selMat)return alert("Escolha o item.");desc=selMat.descricao;un=selMat.unidade;}
 if(!desc||!un||!(+q>0))return alert("Preencha item, unidade e quantidade.");
 itens.push({desc,un,qtd:q,manual,matId:selMat?selMat.id:null,fotos:fFotos});limparItem();renderTab();
};
function renderTab(){
 $("tabItens").innerHTML=itens.length?'<table><thead><tr><th>Item</th><th>Quantidade</th><th>Unidade</th><th>Ação</th></tr></thead><tbody>'+itens.map((i,x)=>'<tr><td>'+esc(i.desc)+(i.manual?' <span class="mu">(manual)</span>':'')+(i.fotos.length?' <span class="mu">📷'+i.fotos.length+'</span>':'')+'</td><td>'+esc(i.qtd)+'</td><td>'+esc(i.un)+'</td><td style="white-space:nowrap"><button class="ic" data-ed="'+x+'" title="Editar">'+ICO_ED+'</button><button class="ic del" data-rm="'+x+'" title="Excluir">'+ICO_DEL+'</button></td></tr>').join("")+'</tbody></table>':'<div class="mu">Nenhum item adicionado.</div>';
 $("tabItens").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{itens.splice(+b.dataset.rm,1);renderTab();});
 $("tabItens").querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{
  const i=itens.splice(+b.dataset.ed,1)[0];selMat=i.matId?mats.find(m=>m.id===i.matId)||null:null;manual=i.manual||!selMat;
  $("itemTxt").value=manual?i.desc:"";$("uni").value=i.un;$("qtd").value=i.qtd;fFotos=i.fotos||[];renderManual();renderFotos();renderTab();$("itemBtn").scrollIntoView({block:"center"});});
}
$("bPdf").onclick=()=>{
 if(!obra)return alert("Selecione a obra.");if(!itens.length)return alert("Adicione ao menos um item.");
 pdf({num:"A definir no envio",usuario:me.nome||me.usuario,quando:fdt(Date.now()),obra:obra.tag+" — "+obra.nome,endereco:obra.endereco,entrega:fd($("dEnt").value),urg:$("fUrg").checked,itens});
};
$("enviar").onclick=async()=>{
 if(!obra)return alert("Selecione a obra.");const ent=$("dEnt").value;if(!ent)return alert("Informe a data da entrega.");if(!itens.length)return alert("Adicione ao menos um item.");
 $("enviar").disabled=true;
 try{
  const {data:r,error}=await sb.from("requisicoes").insert({obra_id:obra.id,tag:obra.tag,empreendimento:obra.nome,endereco:obra.endereco,mestre:me.nome||me.usuario,data_abertura:hoje(),data_entrega:ent,urgente:$("fUrg").checked}).select().single();
  if(error)throw error;
  const {data:ins,error:e2}=await sb.from("requisicao_itens").insert(itens.map((i,x)=>({requisicao_id:r.id,ordem:x,descricao:i.desc,unidade:i.un,quantidade:+i.qtd,manual:i.manual}))).select();
  if(e2)throw e2;
  const rows=[];
  for(let x=0;x<itens.length;x++){const it=ins.find(z=>z.ordem===x);for(let y=0;y<itens[x].fotos.length;y++){const path=r.id+"/"+it.id+"_"+y+".jpg";const {error:e3}=await sb.storage.from("fotos").upload(path,itens[x].fotos[y].blob,{contentType:"image/jpeg"});if(e3)throw e3;rows.push({item_id:it.id,caminho:path});}}
  if(rows.length){const {error:e4}=await sb.from("requisicao_fotos").insert(rows);if(e4)throw e4;}
  ultimo=dadosReq({...r,itens:itens.map(i=>({desc:i.desc,un:i.un,qtd:i.qtd}))});
  resetForm();$("dlgNum").textContent=ultimo.num;$("dlgUser").textContent=ultimo.usuario;$("dlgDt").textContent=ultimo.quando;$("dlg").classList.remove("hide");$("dlgOk").focus();
 }catch(e){erro(e);}
 $("enviar").disabled=false;
};
const fechaDlg=()=>{$("dlg").classList.add("hide");abrirHist();};
$("dlgOk").onclick=fechaDlg;$("dlgPdf").onclick=()=>ultimo&&pdf(ultimo);
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!$("dlg").classList.contains("hide")){e.preventDefault();fechaDlg();}});
document.addEventListener("click",e=>{const t=e.target;if(t.classList&&t.classList.contains("th")&&t.getAttribute("src")){$("lbImg").src=t.src;$("lb").classList.remove("hide");}else if(t.id==="lb"||t.id==="lbImg")$("lb").classList.add("hide");});

/* ---------- histórico ---------- */
const norm=r=>({...r,itens:(r.requisicao_itens||[]).sort((a,b)=>a.ordem-b.ordem).map(i=>({id:i.id,desc:i.descricao,un:i.unidade,qtd:String(i.quantidade),manual:i.manual,fotos:(i.requisicao_fotos||[]).map(f=>({id:f.id,caminho:f.caminho}))}))});
async function carregarReqs(){
 const {data,error}=await sb.from("requisicoes").select("*,requisicao_itens(*,requisicao_fotos(*))").order("abertura_em",{ascending:false});
 if(error)return erro(error);
 reqs=(data||[]).map(norm);
 const fu=$("fU").value,fo=$("fO").value,uniq=a=>[...new Set(a)].sort((a,b)=>String(a).localeCompare(String(b)));
 $("fU").innerHTML='<option value="">Todos</option>'+uniq(reqs.map(r=>r.mestre)).map(u=>'<option>'+esc(u)+'</option>').join("");
 $("fO").innerHTML='<option value="">Todas</option>'+uniq(reqs.map(r=>r.tag)).map(u=>'<option>'+esc(u)+'</option>').join("");
 $("fU").value=fu;$("fO").value=fo;renderHist();
}
function renderHist(){
 const u=$("fU").value,o=$("fO").value,a=$("fA").value,b=$("fB").value;
 const l=reqs.filter(r=>(!u||r.mestre===u)&&(!o||r.tag===o)&&(!a||r.data_abertura>=a)&&(!b||r.data_abertura<=b));
 $("hBody").innerHTML=l.map(r=>'<tr><td><b>'+esc(rn(r.tag,r.numero))+'</b>'+(r.urgente?'<div>'+URG+'</div>':'')+'</td><td>'+esc(r.mestre)+'</td><td>'+fd(r.data_abertura)+'</td><td>'+esc(r.tag)+'</td><td><button class="x" style="color:var(--ac);font-weight:600" data-v="'+r.id+'">Ver</button></td></tr>').join("");
 $("hVazio").classList.toggle("hide",l.length>0);
 $("hBody").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{viewId=b.dataset.v;drawView(reqs.find(r=>r.id===viewId));scrollTo(0,0);});
}
["fU","fO","fA","fB"].forEach(i=>$(i).onchange=renderHist);
$("fLimpa").onclick=()=>{["fU","fO","fA","fB"].forEach(i=>$(i).value="");renderHist();};
async function assinar(r){
 const paths=r.itens.flatMap(i=>i.fotos.map(f=>f.caminho));if(!paths.length)return;
 try{const {data}=await sb.storage.from("fotos").createSignedUrls(paths,3600);(data||[]).forEach(d=>r.itens.forEach(i=>i.fotos.forEach(f=>{if(f.caminho===d.path)f.url=d.signedUrl;})));}catch(e){}
}
async function drawView(r){
 if(!r)return;await assinar(r);
 $("hLista").classList.add("hide");$("hDet").classList.remove("hide");
 $("hDet").innerHTML='<div class="card"><button class="x" id="vBack" style="padding:0 0 8px;color:var(--ac)">← Voltar ao histórico</button><h2 style="margin:0">Solicitação de compra</h2><div style="font-size:20px;font-weight:700">'+esc(rn(r.tag,r.numero))+' '+(r.urgente?URG:'')+'</div>'+obraBox({tag:r.tag,nome:r.empreendimento,endereco:r.endereco})+'<div class="mu" style="margin-top:8px">Usuário: '+esc(r.mestre)+' · '+fdt(r.abertura_em)+'</div><div class="mu">Data da entrega: '+fd(r.data_entrega)+'</div><h2>Itens</h2><div class="tw"><table><thead><tr><th>Item</th><th>Quantidade</th><th>Unidade</th></tr></thead><tbody>'+r.itens.map(i=>'<tr><td>'+esc(i.desc)+(i.manual?' <span class="mu">(manual)</span>':'')+(i.fotos.length&&i.fotos[0].url?'<div class="ths">'+i.fotos.map(f=>'<img class="th" src="'+esc(f.url||"")+'">').join("")+'</div>':'')+'</td><td>'+esc(i.qtd)+'</td><td>'+esc(i.un)+'</td></tr>').join("")+'</tbody></table></div><div class="row wrap" style="margin-top:12px"><button class="o" id="vPdf">Gerar PDF</button>'+(admin?'<button class="o" id="vEdit">Editar</button><button class="o" id="vDel" style="color:#d32f2f;border-color:#d32f2f">Excluir</button>':'')+'</div></div>';
 $("vBack").onclick=()=>{viewId=null;$("hDet").classList.add("hide");$("hLista").classList.remove("hide");};
 $("vPdf").onclick=()=>pdf(dadosReq(r));
 if(admin){$("vEdit").onclick=()=>openEdit(r);
  $("vDel").onclick=async()=>{if(!confirm("Excluir esta solicitação?"))return;const paths=r.itens.flatMap(i=>i.fotos.map(f=>f.caminho));if(paths.length)await sb.storage.from("fotos").remove(paths);const {error}=await sb.from("requisicoes").delete().eq("id",r.id);if(error)return erro(error);abrirHist();};}
}
/* edição (administrador) */
function itemRows(its){return its.map((i,x)=>'<div class="card" style="padding:10px"><input data-i="'+x+'" data-f="desc" placeholder="Descrição" value="'+esc(i.desc)+'"><div class="row" style="margin-top:6px;align-items:center"><input data-i="'+x+'" data-f="qtd" type="number" min="0" step="any" placeholder="Qtd" value="'+esc(i.qtd)+'"><input data-i="'+x+'" data-f="un" placeholder="Unidade" value="'+esc(i.un)+'"><button class="ic del" style="flex:none" data-rm="'+x+'">'+ICO_DEL+'</button></div>'+(i.fotos&&i.fotos.length?'<div class="mu" style="margin-top:6px">'+i.fotos.length+' foto(s) anexada(s)</div>':'')+'</div>').join("");}
function drawIt(){
 $("eIt").innerHTML=itemRows(draft);
 $("eIt").querySelectorAll("[data-i]").forEach(i=>i.oninput=()=>{draft[+i.dataset.i][i.dataset.f]=i.value;});
 $("eIt").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{draft.splice(+b.dataset.rm,1);drawIt();});
}
function openEdit(r){
 edit=true;draft=JSON.parse(JSON.stringify(r.itens));
 $("hDet").innerHTML='<div class="card"><b>Editando '+esc(rn(r.tag,r.numero))+'</b><label>Usuário (nome)</label><input id="eM" value="'+esc(r.mestre)+'"><label>Obra</label><select id="eO">'+(obras.some(o=>o.id===r.obra_id)?'':'<option value="">'+esc(r.tag)+' (não cadastrada)</option>')+obras.map(o=>'<option value="'+o.id+'"'+(o.id===r.obra_id?' selected':'')+'>'+esc(o.tag)+(o.nome?' — '+esc(o.nome):'')+'</option>').join("")+'</select><div class="row wrap"><div><label>Data da solicitação</label><input id="eA" type="date" value="'+esc(r.data_abertura)+'"></div><div><label>Data da entrega</label><input id="eE" type="date" value="'+esc(r.data_entrega)+'"></div></div><label class="ck"><input type="checkbox" id="eU"'+(r.urgente?' checked':'')+'> Urgente</label><h2>Itens</h2><div id="eIt"></div><button class="s" id="eAdd">+ Adicionar item</button><div class="row"><button class="p" id="eSave">Salvar</button><button class="p" id="eCan" style="background:var(--mu)">Cancelar</button></div></div>';
 drawIt();
 $("eAdd").onclick=()=>{draft.push({desc:"",un:"",qtd:"",manual:true,fotos:[]});drawIt();};
 $("eCan").onclick=()=>{edit=false;draft=null;drawView(r);};
 $("eSave").onclick=async()=>{
  if(!draft.length||draft.some(i=>!String(i.desc).trim()||!String(i.un).trim()||!(+i.qtd>0)))return alert("Revise os itens: descrição, unidade e quantidade.");
  if(!$("eM").value.trim()||!$("eA").value||!$("eE").value)return alert("Preencha o nome e as datas.");
  const o=obras.find(x=>x.id===$("eO").value);
  try{
   const up={mestre:$("eM").value.trim(),data_abertura:$("eA").value,data_entrega:$("eE").value,urgente:$("eU").checked};
   if(o){up.obra_id=o.id;up.tag=o.tag;up.empreendimento=o.nome;up.endereco=o.endereco;}
   let {error}=await sb.from("requisicoes").update(up).eq("id",r.id);if(error)throw error;
   const manter=new Set(draft.filter(i=>i.id).map(i=>i.id));
   for(const i of r.itens.filter(i=>!manter.has(i.id))){const ps=i.fotos.map(f=>f.caminho);if(ps.length)await sb.storage.from("fotos").remove(ps);({error}=await sb.from("requisicao_itens").delete().eq("id",i.id));if(error)throw error;}
   for(let x=0;x<draft.length;x++){const i=draft[x],d={ordem:x,descricao:String(i.desc).trim(),unidade:String(i.un).trim(),quantidade:+i.qtd};
    ({error}=i.id?await sb.from("requisicao_itens").update(d).eq("id",i.id):await sb.from("requisicao_itens").insert({...d,requisicao_id:r.id,manual:true}));if(error)throw error;}
   edit=false;draft=null;await carregarReqs();const n=reqs.find(x=>x.id===r.id);if(n)drawView(n);else abrirHist();
  }catch(e){erro(e);}
 };
}
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")telaLogin();});
entrar();
</script></body></html>
